service: aws-classify-tests-${param:suffix, 'local'}
frameworkVersion: '4'

custom:

  directories:
    responseHandlers: "src/server-responses/index"
    staticWebsite: "./static"
    includeFiles: "../../aws-classify-server/yml"
  yml: ${self:custom.directories.includeFiles}
  stage: ${opt:stage,'dev'}
  # DOMAIN is the framework's session-store namespace; no DNS zone is needed.
  domainName: ${self:service}
  handler: "src/server-responses/index"
  bucketName: ${param:contentBucket, self:service}
  serverless-offline:
    host: 127.0.0.1
    httpPort: 4000
    websocketPort: 3001
    lambdaPort: 3002
    useInProcess: true
    localEnvironment: true

plugins:
  - serverless-offline

provider:
  name: aws
  runtime: nodejs22.x
  region: ${opt:region, 'us-east-1'}
  deploymentBucket:
    name: ${param:deploymentBucket, 'aws-classify-tests-local-artifacts'}
  websocketsApiRouteSelectionExpression: $request.body.action
  logs:
    websocket: true
  environment:
    APIG_ENDPOINT: ${file(${self:custom.yml}/apig.yml)}
    DOMAIN: ${self:custom.domainName}
  iam:
    role:
      statements:
      - ${file(${self:custom.yml}/provider-iam.yml)}

functions:
  - ${file(${self:custom.yml}/functions.yml)}

resources:
  - ${file(${self:custom.yml}/resources-website.yml)}
  - ${file(${self:custom.yml}/resources-dynamodb.yml)}
  - Outputs:
      TestApiUrl:
        Value:
          Fn::Join: ['', [Fn::GetAtt: [HttpApi, ApiEndpoint], '/api/dispatch']]
      TestWebSocketUrl:
        Value:
          Fn::Join:
            - ''
            - - 'wss://'
              - ${file(${self:custom.yml}/apig.yml)}
      TestContentBucket:
        Value: !Ref S3Bucket
      TestSessionTable:
        Value: !Ref AWSClassifySessionTable
