service: aws-classify-tests-${param:suffix, 'local'}
frameworkVersion: '4'

custom:

  awsClassify:
    authorizer:
      name: fixtureJwt
      scopes: [aws.cognito.signin.user.admin, fixture/invoke]
    publicSuffix: Public
  directories:
    responseHandlers: "src/server-responses/index"
    staticWebsite: "./static"
    includeFiles: "../../aws-classify-server/yml"
  yml: ${self:custom.directories.includeFiles}
  stage: ${opt:stage,'dev'}
  # DOMAIN is the framework's session-store namespace; no DNS zone is needed.
  domainName: ${self:service}
  handler: "src/server-responses/index"
  bucketName: ${param:contentBucket, self:service}
  serverless-offline:
    host: 127.0.0.1
    httpPort: 4000
    websocketPort: 3001
    lambdaPort: 3002
    useInProcess: true
    localEnvironment: true

plugins:
  - serverless-offline

provider:
  name: aws
  httpApi:
    cors: true
    authorizers:
      fixtureJwt:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: !Join ['', ['https://cognito-idp.', !Ref AWS::Region, '.amazonaws.com/', !Ref AuthUserPool]]
        audience: [!Ref AuthManagedClient, !Ref AuthUserClient, !Ref AuthMachineClient, !Ref WrongIssuerClient]
  runtime: nodejs22.x
  region: ${opt:region, 'us-east-1'}
  deploymentBucket:
    name: ${param:deploymentBucket, 'aws-classify-tests-local-artifacts'}
  websocketsApiRouteSelectionExpression: $request.body.action
  logs:
    websocket:
      fullExecutionData: false
  environment:
    APIG_ENDPOINT: ${file(${self:custom.yml}/apig.yml)}
    DOMAIN: ${self:custom.domainName}
  iam:
    role:
      name: ${self:service}-role
      statements:
      - ${file(${self:custom.yml}/provider-iam.yml)}

functions:
  - ${file(${self:custom.yml}/functions-authenticated.yml)}
  - preflight:
      name: ${self:service}-${sls:stage}-options
      handler: src/server-responses/index.preflight
      events:
        - httpApi:
            path: /api/dispatch
            method: OPTIONS
  - backgroundNotify:
      name: ${self:service}-${sls:stage}-notify
      handler: src/server-responses/index.backgroundNotify
      environment:
        AWS_CLASSIFY_AUTHENTICATION: 'true'
        AWS_CLASSIFY_PUBLIC_SUFFIX: Public

resources:
  - ${file(${self:custom.yml}/resources-website-authenticated.yml)}
  - ${file(${self:custom.yml}/resources-dynamodb.yml)}
  - ${file(auth-resources.yml)}
  - Outputs:
      TestApiUrl:
        Value:
          Fn::Join: ['', [Fn::GetAtt: [HttpApi, ApiEndpoint], '/api/dispatch']]
      TestWebSocketUrl:
        Value:
          Fn::Join:
            - ''
            - - 'wss://'
              - ${file(${self:custom.yml}/apig.yml)}
      TestContentBucket:
        Value: !Ref S3Bucket
      TestSessionTable:
        Value: !Ref AWSClassifySessionTable
